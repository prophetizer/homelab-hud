# Sonarr — service health, download queue and disk space over the v3 REST API.
#
# Copy to /config/providers/sonarr.yaml, then supply:
#   SONARR_BASE_URL                  e.g. http://sonarr.lab:8989 (environment)
#   ${secret:sonarr_api_key}         Settings → General → API Key
#     → /run/secrets/sonarr_api_key, HUD_SECRET_SONARR_API_KEY, or secrets.yaml
#
# Mapped from the vendor's published OpenAPI document (see metadata.template.docs); every
# field used here is in Sonarr's v3 contract.
apiVersion: hud/v1
kind: Provider
metadata:
  name: sonarr
  labels: { category: media }
  template:
    service: Sonarr
    icon: mdi:television-classic
    docs: https://sonarr.tv/docs/api/
    requires:
      - { name: SONARR_BASE_URL, kind: env, hint: "Base URL of your Sonarr instance" }
      - { name: sonarr_api_key, kind: secret, hint: "API key from Settings → General" }
spec:
  transport:
    base_url: ${SONARR_BASE_URL}
    auth:
      type: api_key
      header: X-Api-Key
      key: ${secret:sonarr_api_key}
    timeout: 10s
  defaults:
    interval: 60s
    jitter: 10s

  resources:
    # The service itself. One resource; reaching /system/status at all means it is up,
    # and a failed poll degrades the tile through the collector, not through a state here.
    - name: service
      request: { method: GET, path: /api/v3/system/status }
      interval: 5m
      map:
        # Singleton: one Sonarr per provider, so the native id is a literal.
        uid:   "sonarr:service:main"
        kind:  service
        name:  "{{ item.instanceName | default('Sonarr') }}"
        state: up
        attrs:
          version:  "{{ item.version }}"
          branch:   "{{ item.branch }}"
          os:       "{{ item.osName }}"
          docker:   "{{ item.isDocker }}"
          url_base: "{{ item.urlBase }}"
        links:
          ui: "${SONARR_BASE_URL}/activity/queue"

    # Health checks. `source` is the check's class name — stable, so it is a safe uid.
    # notice is informational and stays `up`; warning degrades, error is down.
    - name: health
      request: { method: GET, path: /api/v3/health }
      interval: 5m
      map:
        uid:   "sonarr:health_check:{{ item.source }}"
        kind:  health_check
        name:  "{{ item.source }}"
        state: >-
          {{ 'down' if item.type == 'error'
               else 'degraded' if item.type == 'warning'
               else 'up' }}
        parent_uid: "sonarr:service:main"
        attrs:
          message:  "{{ item.message }}"
          severity: "{{ item.type }}"
        links:
          wiki: "{{ item.wikiUrl }}"

    # Queue items, keyed on the episode first and the download client's id second.
    # Found on a live server: a pending item (held by a delay profile, not yet sent to the
    # download client) has no downloadId, and an unknown item (a download that could not
    # be matched) has no episodeId. Episode-first also keeps the uid unchanged when
    # a pending item is grabbed, rather than forking its history at that moment
    # (invariant 8). The queue row's own `id` changes, so it is never used.
    # The queue in one number, for a service card. Singleton.
    - name: queue_status
      request: { method: GET, path: /api/v3/queue/status }
      interval: 60s
      map:
        uid:   "sonarr:queue:main"
        kind:  queue
        name:  Queue
        state: >-
          {{ 'down' if item.errors else 'degraded' if item.warnings else 'up' }}
        parent_uid: "sonarr:service:main"
      metrics:
        - { name: queued, value: "{{ item.totalCount | float }}", unit: count }

    - name: queue
      request:
        method: GET
        path: /api/v3/queue
        params: { pageSize: "50", includeUnknownItems: "true", includeSeries: "true" }
      select: "$.records[*]"
      interval: 30s
      map:
        uid: >-
          sonarr:download:{{ ('ep-' ~ item.episodeId) if item.episodeId
             else ('dl-' ~ item.downloadId) if item.downloadId
             else '' }}
        kind:  download
        name:  "{{ item.series.title | default(item.title) }}"
        state: >-
          {{ 'down' if item.status == 'failed' or item.trackedDownloadStatus == 'error'
               else 'paused' if item.status == 'paused'
               else 'degraded' if item.status in ['warning', 'delay', 'downloadClientUnavailable']
                                  or item.trackedDownloadStatus == 'warning'
               else 'up' }}
        parent_uid: "sonarr:service:main"
        attrs:
          status:          "{{ item.status }}"
          tracked_state:   "{{ item.trackedDownloadState }}"
          protocol:        "{{ item.protocol }}"
          download_client: "{{ item.downloadClient }}"
          indexer:         "{{ item.indexer }}"
          error:           "{{ item.errorMessage }}"
          # Why an import is stuck, in Sonarr's words — the first status message, if any.
          reason: >-
            {{ (item.statusMessages[0].messages[0] if item.statusMessages
                and item.statusMessages[0].messages else none) }}
          # Poster and fanart as paths on this Sonarr (MediaCover), fetched by HUD with the
          # API key through /api/v1/images — never by the browser.
          image: >-
            {{ (item.series.images | selectattr('coverType', 'equalto', 'poster')
                | map(attribute='url') | first) if item.series and item.series.images else none }}
          backdrop: >-
            {{ (item.series.images | selectattr('coverType', 'equalto', 'fanart')
                | map(attribute='url') | first) if item.series and item.series.images else none }}
      metrics:
        - { name: size_bytes,      value: "{{ item.size | float }}",     unit: bytes }
        - { name: remaining_bytes, value: "{{ item.sizeleft | float }}", unit: bytes }
        # Progress is what a tile actually shows; computing it here keeps the widget generic.
        - name: progress_pct
          when: "{{ item.size | float > 0 }}"
          value: "{{ (item.size | float - item.sizeleft | float) / (item.size | float) }}"
          unit: ratio

    # Root folders, one resource each. Free space is the number that matters at 3am.
    - name: diskspace
      request: { method: GET, path: /api/v3/diskspace }
      interval: 5m
      map:
        uid:   "sonarr:storage:{{ item.path }}"
        kind:  storage
        name:  "{{ item.label | default(item.path) }}"
        state: up
        parent_uid: "sonarr:service:main"
        attrs:
          path: "{{ item.path }}"
      metrics:
        - { name: free_bytes,  value: "{{ item.freeSpace | float }}",  unit: bytes }
        - { name: total_bytes, value: "{{ item.totalSpace | float }}", unit: bytes }
        - name: used_pct
          when: "{{ item.totalSpace | float > 0 }}"
          value: >-
            {{ (item.totalSpace | float - item.freeSpace | float) / (item.totalSpace | float) }}
          unit: ratio
