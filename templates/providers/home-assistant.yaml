# Home Assistant — sensors and automations over the REST API.
#
# Copy to /config/providers/home-assistant.yaml, then supply:
#   HA_BASE_URL                       e.g. http://homeassistant.lab:8123 (environment)
#   ${secret:home_assistant_token}    a long-lived access token (Profile → Security)
#     → /run/secrets/home_assistant_token, HUD_SECRET_HOME_ASSISTANT_TOKEN, or secrets.yaml
apiVersion: hud/v1
kind: Provider
metadata:
  name: home-assistant
  labels: { category: automation }
  template:
    service: Home Assistant
    icon: mdi:home-assistant
    docs: https://developers.home-assistant.io/docs/api/rest/
    requires:
      - { name: HA_BASE_URL, kind: env, hint: "Base URL of your Home Assistant instance" }
      - { name: home_assistant_token, kind: secret, hint: "Long-lived access token (Profile → Security)" }
spec:
  transport:
    base_url: ${HA_BASE_URL}
    auth:
      type: bearer
      token: ${secret:home_assistant_token}
    timeout: 5s
    verify_tls: true
  defaults:
    interval: 30s
    jitter: 5s

  resources:
    # Every sensor.* entity. Numeric states become a metric named `value` whose unit is
    # taken from unit_of_measurement (°C, %, W, GiB, …) and normalized at the boundary.
    - name: sensors
      request: { method: GET, path: /api/states }
      select: "$[?(@.entity_id =~ '^sensor\\.')]"
      map:
        uid:   "home-assistant:sensor:{{ item.entity_id }}"
        kind:  sensor
        name:  "{{ item.attributes.friendly_name | default(item.entity_id) }}"
        state: "{{ 'up' if item.state not in ['unavailable', 'unknown'] else 'down' }}"
        attrs:
          device_class: "{{ item.attributes.device_class }}"
          raw_state:    "{{ item.state }}"
        links:
          ui: "${HA_BASE_URL}/history?entity_id={{ item.entity_id }}"
      metrics:
        - name: value
          when: "{{ item.state | is_number }}"
          value: "{{ item.state | float }}"
          unit_from: "{{ item.attributes.unit_of_measurement }}"

    # Automations: on → up, off → paused. Slow-changing, so polled less often.
    - name: automations
      request: { method: GET, path: /api/states }
      select: "$[?(@.entity_id =~ '^automation\\.')]"
      interval: 5m
      map:
        uid:   "home-assistant:automation:{{ item.entity_id }}"
        kind:  automation
        name:  "{{ item.attributes.friendly_name | default(item.entity_id) }}"
        state: "{{ 'up' if item.state == 'on' else 'paused' }}"
        attrs:
          last_triggered: "{{ item.attributes.last_triggered }}"
        links:
          ui: "${HA_BASE_URL}/config/automation/dashboard"
