# Two independent environments, one per database file. Programmatic use goes through
# hud.store.migrate.upgrade_all; this file exists for `alembic -n <env> revision -m "..."`.
[alembic]
script_location = %(here)s/hud/store/migrations/dashboard

[dashboard]
script_location = %(here)s/hud/store/migrations/dashboard

[metrics]
script_location = %(here)s/hud/store/migrations/metrics

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
