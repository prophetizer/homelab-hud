# HUD — Phase 0 compose (PLAN.md §11.1).
#
# Differences from the plan's target file, all deliberate so a fresh clone starts with
# `docker compose up --build` and nothing else:
#   * builds locally instead of pulling a released image
#   * publishes :8080 on the default network instead of relying on an external `proxy`
#     network + Traefik (the labels are kept below, commented, for when you front it)
#   * no `secrets:` block yet — no Phase 0 provider needs one
#   * socket-proxy pinned by tag+digest instead of `latest`
services:
  hud:
    build: .
    image: homelabhud/homelabhud:dev
    container_name: hud
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    tmpfs: [/tmp]
    environment:
      TZ: ${TZ:-UTC}
      HUD_CONFIG_DIR: /config
      HUD_DATA_DIR: /data
      HUD_LOG_LEVEL: ${HUD_LOG_LEVEL:-INFO}
      # Docker provider (Phase 1) will talk to the sidecar, never to the socket.
      DOCKER_HOST: tcp://socket-proxy:2375
    volumes:
      # ./config must exist before `up`, or Docker creates it root-owned and uid 1000
      # cannot write the initial settings.yaml. The repo ships it with a .gitkeep.
      - ./config:/config
      - hud-data:/data
    ports:
      - "8080:8080"
    depends_on: [socket-proxy]
    healthcheck:
      test: ["CMD", "python", "-m", "hud.healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [default, lab]
    # labels:
    #   traefik.enable: "true"
    #   traefik.http.routers.hud.rule: "Host(`dash.lab.internal`)"
    #   traefik.http.routers.hud.entrypoints: "websecure"
    #   traefik.http.routers.hud.middlewares: "sec-headers@file"
    #   traefik.http.services.hud.loadbalancer.server.port: "8080"

  socket-proxy:
    # linuxserver/socket-proxy — granular allow-flags, unlike Tecnativa's blanket POST=1.
    image: lscr.io/linuxserver/socket-proxy:3.4.4-r0-ls97@sha256:ba211325155c463a1a6e6a038c928f21447a8e60ce02ecf41302047974097e84
    container_name: hud-socket-proxy
    restart: unless-stopped
    read_only: true
    tmpfs: [/run]
    environment:
      CONTAINERS: "1"
      IMAGES: "1"
      INFO: "1"
      POST: "0"            # stays 0 through Phases 0-2 (read-only); revisit in Phase 3
      ALLOW_START: "0"
      ALLOW_STOP: "0"
      ALLOW_RESTARTS: "0"
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]
    networks: [lab]

volumes:
  hud-data:

networks:
  lab:
    internal: true
